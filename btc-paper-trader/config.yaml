data:
  parquet_path: data/btcusdt_1h.parquet
  binance_base_url: https://api.binance.us     # US-accessible (Binance.com returns 451)
  kraken_futures_url: https://futures.kraken.com  # For funding rate + OI (Binance Futures blocked)
  symbol: BTCUSDT
  kraken_symbol: PF_XBTUSD
  fetch_retry_attempts: 3
  fetch_retry_delay_seconds: 60
  # Venue provenance (hardening spec WS8). The series changed venue at
  # 2026-03-01 (binance_com -> binance_us). primary_venue is the live source;
  # any append or backfill of a different venue is refused unless the override
  # below is set. Run scripts/migrate_add_venue.py once to stamp existing rows.
  primary_venue: binance_us
  allow_venue_mismatch: false

model:
  artifact_path: artifacts/model_943751e.joblib
  scale_factor: 0.35
  ema_span: 20

models:
  # Champion/challenger roster (hardening spec WS6). Artifact 943751e is the
  # PERMANENT control — never retrained, replaced, or improved in place. The
  # research agent's future exports run BESIDE it as challengers with their own
  # state, ledger, and report files (same pipeline, in parallel), so a challenger
  # can never collide with the control's records. The 30-day staleness alarm is
  # repointed at challengers only: the control is exempt by design, resolving the
  # contradiction of a frozen model alarmed for being frozen.
  - id: control-943751e
    role: control
    artifact_path: artifacts/model_943751e.joblib
    state_path: data/portfolio_state.json
    prediction_log: logs/predictions.csv
    trade_log: logs/trades.csv
    daily_summary_log: logs/daily_summary.csv
    report_path: logs/daily_report.txt
    # Realised behaviour over the audited 136-day record — recorded so
    # challengers are compared against what the control DID, not a symmetric
    # backtest it never traded. It is long-only in practice (0 shorts in 118
    # trades) not by a directional filter but because the post-processing chain
    # shrinks raw predictions ~5x, so a short needs a raw pred below ~-1.05 sigma
    # to clear the -0.20 entry threshold, which never happened.
    realised:
      shorts_taken: 0
      long_trades: 107
      episodes: 11
      effective_shrink: 5.0
      entry_threshold_sigma: -0.20
      note: long-only in practice; symmetric backtest Sharpe not comparable to realised
  # Challengers are appended as the agent exports them, e.g.:
  #   - id: challenger-<commit>
  #     role: challenger
  #     artifact_path: artifacts/model_<commit>.joblib
  #   (state/ledger/report default to logs/challengers/<commit>/… — never the
  #    control's files). Promotion to a live-capital candidate is by
  #    pre-registered gates only; see docs/champion-challenger.md.

integrity:
  # Startup environment-integrity checks (hardening spec WS4). The artifact's
  # stored reference predictions are recomputed under the running environment
  # every startup; a mismatch means the models no longer behave as exported.
  enforce: true               # false = log-only diagnostic mode (never refuse to run)
  reference_atol: 1.0e-6      # max |diff| tolerated when reproducing reference predictions
  # Only consulted when reference predictions still match. warn = benign skew
  # (default, per audit: 1.7.2 -> 1.8.0 reproduces bit-exactly); fatal = refuse;
  # ignore = say nothing.
  on_version_mismatch: warn

trading:
  sigma_threshold: 0.20
  sigma_full_position: 0.50
  fee_rate: 0.001
  slippage_rate: 0.0005
  starting_portfolio_value: 1.0
  # On resume after an outage, book each missed hour individually (WS1). A gap
  # longer than this is clamped to the most recent window and the truncation is
  # logged; the earlier gap is left for WS2 frozen-gap tagging.
  max_catchup_hours: 168
  # Resume policy (WS2, decision D1). Default false: hold the inherited position
  # through an outage and tag its P&L frozen — the honest record, since the model
  # never ran those hours. true flattens to no exposure for the gap, which
  # changes the strategy; kept off by default.
  flatten_on_resume: false

logging:
  prediction_log: logs/predictions.csv
  trade_log: logs/trades.csv
  daily_summary_log: logs/daily_summary.csv
  system_log: logs/system.log
  system_log_max_bytes: 10485760  # 10MB
  system_log_backup_count: 3

monitoring:
  # Dead-man's switch (hardening spec WS3, decision D3). A healthy system is
  # silent (D7); the only page that ever fires is the one that says it stopped.
  # On every SUCCESSFUL run the trader pings an external heartbeat service
  # (healthchecks.io). If the pings stop arriving, that service pages Ian — so
  # its silence is what alerts, which is the fix for the failure actually
  # observed (35% of hours simply absent, nothing watching for absence).
  heartbeat:
    enabled: true
    # The ping URL is a CREDENTIAL — anyone holding it can forge heartbeats and
    # keep a dead trader looking alive — so it is NEVER committed. Config stores
    # only the NAME of the env var that holds it; the value reaches the process
    # from the mode-600 EnvironmentFile on the Pi (deploy/btc-paper-trader.env),
    # outside the repo. Startup fails hard if it is unset, empty, or still a
    # placeholder — the Telegram failure mode (an unexpanded ${VAR} posted as a
    # live value, 404ing silently for 136 days) inverted.
    url_env: HEARTBEAT_PING_URL
    timeout_seconds: 10

alerts:
  method: file  # file | slack | telegram
  alert_file: logs/alerts.log
  drawdown_threshold: -0.10
  prediction_sanity_threshold: 2.0
  model_staleness_days: 30
  # Disk check (WS3). On the dedicated Pi a full SD card is a real shared-tenant
  # risk (Tally shares the host), so alert on the fill RATE as well as the level:
  # a card trending toward full within the horizon pages before it hits the level
  # threshold. On the macOS laptop this check was a false alarm (it measured the
  # owner's whole APFS container); on the Pi it is meaningful.
  disk_path: /
  disk_pct_threshold: 0.90        # level: warn above this fraction used
  disk_fill_horizon_days: 7       # rate: warn if projected full within this many days

funding:
  model_funding_cost: true        # apply funding rate to P&L
  funding_rate_source: kraken     # use kraken funding_rate from parquet

bip_tracking:
  enabled: true
  contract_size: 0.01             # BTC per contract
  fee_per_contract: 0.46          # USD (exchange + commission + clearing + NFA)
  slippage_bps: 5.0

archiver:
  # Hardened supplementary capture (hardening spec WS7). Runs as its OWN systemd
  # timer (btc-paper-trader-archiver.timer, hourly at :02), not inside the trading
  # pipeline — in the audited record capture sat behind the candle fetch, so its
  # coverage matched the pipeline's 65.4%, and unlike candles this data cannot be
  # backfilled. Rows are keyed (venue, symbol, timestamp[UTC]) with schema_version
  # and capture_status; an hour the archiver missed is written as an explicit
  # 'gap' row by the next successful run, so absence is recorded, never inferred.
  # The never-run liquidation websocket aggregator (src/liquidations.py) was
  # deleted here per WS1 (wire it in or delete it); it is in git history if a
  # future model iteration wants it.
  orderbook_path: data/orderbook_1h.parquet
  open_interest_path: data/open_interest_1h.parquet
  # Adding a symbol is a config change, not a code change: each target captures
  # its order book from data.binance_base_url and its open interest + funding
  # from one Kraken Futures ticker call.
  targets:
    - symbol: BTCUSDT           # Binance US spot order book
      kraken_symbol: PF_XBTUSD  # Kraken Futures open interest + funding

reporting:
  daily_report_path: logs/daily_report.txt
  # Disabled 2026-08-06: telegram delivery 404'd on all 83 attempts since
  # inception — YAML does not expand ${VAR}, so the literal placeholder was
  # posted as the bot token. Report is still always written to file.
  # Do not re-enable without a delivery test; see hardening spec WS3.
  delivery_method: file  # file | email | telegram | slack
  # telegram_bot_token: ${TELEGRAM_BOT_TOKEN}  # env var
  # telegram_chat_id: ${TELEGRAM_CHAT_ID}      # env var
  # email_smtp_host: smtp.gmail.com
  # email_smtp_port: 587
  # email_from: autotrader@example.com
  # email_to: ian@example.com
  # slack_webhook_url: https://hooks.slack.com/...
